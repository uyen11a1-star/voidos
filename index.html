<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoidOS</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <main>
    <h1>VoidOS <small>v0.1 · Phase 2: Memory</small></h1>
    <pre id="screen" aria-live="polite"></pre>
    <p id="status"></p>
    <p id="memstat"></p>
    <pre id="memdump" aria-label="Memory dump"></pre>
    <div class="row">
      <button id="run" type="button">Chạy lại</button>
      <button id="prot" type="button">Test bảo vệ</button>
      <button id="stop" type="button">Dừng</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
